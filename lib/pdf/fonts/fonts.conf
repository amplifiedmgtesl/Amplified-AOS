<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for server-side PDF rendering (lib/pdf/render-pdf.ts).
  Serverless Chrome ships only Open Sans, so AOS's Arial/Helvetica/Georgia
  stacks would all fall back to it. Liberation Sans is metric-compatible with
  Arial (same character widths), so printed layouts keep their line breaks.
  The <dir> for this folder is added at runtime (render-pdf.ts writes a copy
  of this file with the real path).
-->
<fontconfig>
  <dir>/tmp/fonts</dir>
  <dir>__AOS_FONT_DIR__</dir>
  <cachedir>/tmp/fonts-cache/</cachedir>

  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Roboto</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Black</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Impact</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Narrow Bold</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>

  <!-- "Arial Black" should be heavy even though Liberation has no Black weight. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Arial Black</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
